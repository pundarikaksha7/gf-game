<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ananya Adventures</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --transition-fast: 150ms;
            --transition-normal: 300ms;
            --ease-out: cubic-bezier(0.0, 0, 0.2, 1);
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 32px;
            --space-xl: 48px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            font-family: 'Inter', sans-serif;
        }

        #game-world {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #10151f;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            /* Wide, Mario-style side-scroller viewport with proportional art. */
            width: min(100vw, 177.777vh);
            height: min(100vh, 56.25vw);
            box-shadow: 0 0 42px rgba(0,0,0,.48);
        }

        /* Touch Controls */
        .touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .touch-controls > * {
            pointer-events: auto;
        }

        .joystick-zone {
            position: absolute;
            bottom: 80px;
            left: 32px;
            width: 200px;
            height: 200px;
        }

        .joystick-base {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.4);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .joystick-knob {
            position: absolute;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            border: 2px solid rgba(255,255,255,0.8);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: none;
        }

        .jump-btn {
            position: absolute;
            bottom: 96px;
            right: 40px;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: rgba(255, 200, 60, 0.7);
            border: 3px solid rgba(255, 220, 100, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.3);
            user-select: none;
            -webkit-user-select: none;
        }

        .jump-btn:active {
            background: rgba(255, 220, 100, 0.9);
            transform: scale(0.92);
        }

        /* Combat buttons sit above jump on the right for easy thumb access. */
        .attack-btn {
            position: absolute;
            right: 40px;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 25px;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.35);
            user-select: none;
            -webkit-user-select: none;
            transition: transform 80ms ease, filter 80ms ease;
        }

        .attack-btn:active,
        .attack-btn.pressed {
            transform: scale(0.92);
            filter: brightness(1.18);
        }

        .punch-btn {
            bottom: 224px;
            background: rgba(238, 92, 126, 0.82);
            border: 3px solid rgba(255, 160, 180, 0.95);
        }

        .kick-btn {
            bottom: 352px;
            background: rgba(116, 104, 224, 0.84);
            border: 3px solid rgba(174, 164, 255, 0.95);
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            pointer-events: none;
            z-index: 10;
        }

        .hud-label {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .level-name {
            display: block;
            margin-top: 2px;
            font-size: 22px;
            color: #ffe87c;
            letter-spacing: 0.5px;
        }

        .health-row {
            display: block;
            margin-top: 6px;
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            letter-spacing: 3px;
            line-height: 32px;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.55);
        }

        .heart-full { color: #ff4f78; }
        .heart-empty { color: rgba(255,255,255,0.48); }

        .enemy-count {
            display: block;
            margin-top: 2px;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            color: #fff;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.5);
        }

        .combat-help,
        .attack-state {
            display: block;
            margin-top: 4px;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            color: #fff;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.5);
        }

        .attack-state {
            color: #ffe87c;
            min-height: 22px;
        }

        /* Edit mode info */
        .edit-banner {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 22px;
            padding: 8px 16px;
            border-radius: 8px;
            z-index: 20;
            pointer-events: none;
        }

        .level-transition-overlay,
        .completion-overlay {
            position: absolute;
            inset: 0;
            z-index: 35;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: rgba(18, 20, 48, 0.68);
            pointer-events: auto;
        }

        .level-transition-overlay.is-hidden,
        .completion-overlay.is-hidden {
            display: none;
        }

        .stage-card {
            width: min(600px, calc(100% - 48px));
            padding: 40px 30px 34px;
            border: 4px solid #ffe27a;
            border-radius: 28px;
            background: linear-gradient(160deg, #293e76, #20234f);
            box-shadow: 0 18px 48px rgba(0,0,0,0.42);
            text-align: center;
            color: #fff;
        }

        .stage-kicker {
            margin: 0 0 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            color: #a9efff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stage-title {
            margin: 0;
            font-family: 'Fredoka', sans-serif;
            font-size: 54px;
            line-height: 1;
            color: #ffe27a;
            text-shadow: 3px 4px 0 #20234f;
        }

        .stage-copy {
            margin: 18px 0 0;
            font-family: 'Fredoka', sans-serif;
            font-size: 25px;
            line-height: 1.25;
            color: #f1f6ff;
        }

        .completion-overlay {
            z-index: 45;
            background: rgba(28, 12, 42, 0.78);
        }

        .completion-overlay .stage-card {
            border-color: #ff9abb;
            background: linear-gradient(160deg, #5a2f72, #2b214f);
        }

        .game-over-overlay {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: rgba(30, 18, 48, 0.72);
            pointer-events: auto;
        }

        .game-over-overlay.is-hidden {
            display: none;
        }

        .game-over-card {
            width: min(560px, calc(100% - 48px));
            padding: 42px 28px 34px;
            border: 4px solid #ff8bb0;
            border-radius: 28px;
            background: linear-gradient(160deg, #40295f, #241d46);
            box-shadow: 0 18px 48px rgba(0,0,0,0.42);
            text-align: center;
            color: #fff;
        }

        .game-over-title {
            margin: 0;
            font-family: 'Fredoka', sans-serif;
            font-size: 58px;
            line-height: 1;
            color: #ff9abb;
            text-shadow: 3px 4px 0 #241d46;
        }

        .game-over-copy {
            margin: 18px 0 28px;
            font-family: 'Fredoka', sans-serif;
            font-size: 25px;
            line-height: 1.25;
            color: #fff4fb;
        }

        .restart-btn {
            min-width: 260px;
            min-height: 96px;
            padding: 16px 28px;
            border: 4px solid #ffe28a;
            border-radius: 18px;
            background: #f39a3f;
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 0 rgba(120, 55, 30, 0.35);
            box-shadow: 0 7px 0 #b96132;
            cursor: pointer;
            touch-action: manipulation;
        }

        .restart-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #b96132;
            filter: brightness(1.1);
        }

        .completion-overlay .stage-card { max-height: 86vh; overflow-y: auto; box-sizing: border-box; }
        @media (max-height: 500px) { .award-art svg { height: 90px; } .completion-overlay .stage-card { padding: 16px; } .completion-overlay .stage-title { font-size: 30px; } .completion-overlay .stage-copy { font-size: 16px; } }
        .powerup-notice { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); max-width: 48vw; padding: 14px 20px; background: #17243bf2; border: 1px solid #91f3da; border-radius: 12px; color: #fff; font-weight: 600; text-align: center; z-index: 25; pointer-events:none; transition: opacity .25s; }
        .powerup-status { color:#8ff4d2; font-size:13px; margin-top:8px; }
        @media (max-width: 900px) { .powerup-notice { top:auto; bottom:12px; font-size:12px; max-width:65vw; padding:8px 12px; } }
        .hud { background: linear-gradient(120deg, rgba(14,24,43,.88), rgba(14,24,43,.55)); padding: 16px 22px; border: 1px solid #ffffff30; border-radius: 16px; box-shadow: 0 8px 32px #0003; }
        .hud-label { font-size: 23px; letter-spacing: .3px; }
        .combat-help { font-size: 12px; opacity: .85; }
        @media (hover: hover) and (pointer: fine) { .touch-controls { display: none; } }
        @media (max-height: 500px) { .hud { padding: 8px 12px; top: 8px; left: 8px; } .hud-label { font-size: 18px; } .attack-btn,.jump-btn { width: 64px; height: 64px; right: 18px; font-size: 16px; } .jump-btn { bottom: 22px; } .punch-btn { bottom: 98px; } .kick-btn { bottom: 174px; } .joystick-zone { bottom: 12px; left: 12px; width: 140px; height: 140px; } .joystick-base { width: 110px; height: 110px; } }
    </style>
</head>
<body>
    <div id="game-world">
        <canvas id="game-canvas"></canvas>
    </div>

    <script>
    /*
     * Ananya Adventures — Step 1: Move and Jump
     * A 2D side-scrolling beat-em-up platformer.
     * This step implements basic player movement, jumping, gravity,
     * ground/platform collision, and a camera that follows the player.
     */
    async function run(mode) {
        const gameWorld = document.getElementById('game-world');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const VIEW_W = 1280;
        const VIEW_H = 720;
        const WORLD_SCALE = VIEW_H / 1280;
        const viewportWidth = () => canvas.width / WORLD_SCALE;
        const viewportHeight = () => canvas.height / WORLD_SCALE;

        function resizeCanvas() {
            // World coordinates were authored for a portrait arcade screen. Keeping
            // a stable internal resolution prevents the ground at y=1080 from
            // disappearing below a short browser viewport.
            canvas.width = VIEW_W;
            canvas.height = VIEW_H;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Running from file:// does not have the creator host's injected config.
        // Keep a complete local baseline so the game boots in either environment.
        const cfg = window.gameConfig || {
            player: { startX: 224, startY: 968, moveSpeed: 400, jumpForce: 950, maxHealth: 5, invincibilityDuration: 0.85 },
            physics: { gravity: 1800 },
            level: { groundY: 1080, lengthMultiplier: 1 },
            combat: { punchDamage: 12, kickDamage: 22, punchCooldown: 0.28, kickCooldown: 0.7 },
            enemies: { count: 6, smallHealth: 28, mediumHealth: 52, largeHealth: 88, speed: 120, aggressionRange: 104, smallDamage: 0.35, mediumDamage: 0.5, largeDamage: 0.75 },
            hazards: { holeCount: 6, minHoleWidth: 140, maxHoleWidth: 240, fallDamage: 1 }
        };

        // ── Show editable parameters ──
        if (window.lib && typeof window.lib.showGameParameters === 'function') window.lib.showGameParameters({
            name: 'Player Settings',
            params: {
                'Move Speed': { key: 'player.moveSpeed', type: 'slider', min: 100, max: 800, step: 10 },
                'Jump Force': { key: 'player.jumpForce', type: 'slider', min: 200, max: 1200, step: 10 },
                'Gravity': { key: 'physics.gravity', type: 'slider', min: 500, max: 3000, step: 50 },
                'Level Length Multiplier': { key: 'level.lengthMultiplier', type: 'slider', min: 0.6, max: 2.5, step: 0.1 },
                'College Platform 1 X': { key: 'levels.0.platforms.0.x', type: 'slider', min: 0, max: 3600, step: 8 },
                'College Platform 1 Y': { key: 'levels.0.platforms.0.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'College Platform 2 X': { key: 'levels.0.platforms.1.x', type: 'slider', min: 0, max: 3600, step: 8 },
                'College Platform 2 Y': { key: 'levels.0.platforms.1.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'College Platform 3 X': { key: 'levels.0.platforms.2.x', type: 'slider', min: 0, max: 3600, step: 8 },
                'College Platform 3 Y': { key: 'levels.0.platforms.2.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'College Platform 4 X': { key: 'levels.0.platforms.3.x', type: 'slider', min: 0, max: 3600, step: 8 },
                'College Platform 4 Y': { key: 'levels.0.platforms.3.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Office Platform 1 X': { key: 'levels.1.platforms.0.x', type: 'slider', min: 0, max: 4800, step: 8 },
                'Office Platform 1 Y': { key: 'levels.1.platforms.0.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Office Platform 2 X': { key: 'levels.1.platforms.1.x', type: 'slider', min: 0, max: 4800, step: 8 },
                'Office Platform 2 Y': { key: 'levels.1.platforms.1.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Office Platform 3 X': { key: 'levels.1.platforms.2.x', type: 'slider', min: 0, max: 4800, step: 8 },
                'Office Platform 3 Y': { key: 'levels.1.platforms.2.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Office Platform 4 X': { key: 'levels.1.platforms.3.x', type: 'slider', min: 0, max: 4800, step: 8 },
                'Office Platform 4 Y': { key: 'levels.1.platforms.3.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Bar Platform 1 X': { key: 'levels.2.platforms.0.x', type: 'slider', min: 0, max: 5600, step: 8 },
                'Bar Platform 1 Y': { key: 'levels.2.platforms.0.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Bar Platform 2 X': { key: 'levels.2.platforms.1.x', type: 'slider', min: 0, max: 5600, step: 8 },
                'Bar Platform 2 Y': { key: 'levels.2.platforms.1.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Bar Platform 3 X': { key: 'levels.2.platforms.2.x', type: 'slider', min: 0, max: 5600, step: 8 },
                'Bar Platform 3 Y': { key: 'levels.2.platforms.2.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Bar Platform 4 X': { key: 'levels.2.platforms.3.x', type: 'slider', min: 0, max: 5600, step: 8 },
                'Bar Platform 4 Y': { key: 'levels.2.platforms.3.y', type: 'slider', min: 600, max: 1100, step: 8 },
                'Max Health': { key: 'player.maxHealth', type: 'slider', min: 1, max: 12, step: 1 },
                'Invincibility Duration': { key: 'player.invincibilityDuration', type: 'slider', min: 0.2, max: 3, step: 0.05 },
                'Punch Damage': { key: 'combat.punchDamage', type: 'slider', min: 1, max: 50, step: 1 },
                'Kick Damage': { key: 'combat.kickDamage', type: 'slider', min: 1, max: 80, step: 1 },
                'Punch Cooldown': { key: 'combat.punchCooldown', type: 'slider', min: 0.1, max: 1, step: 0.05 },
                'Kick Cooldown': { key: 'combat.kickCooldown', type: 'slider', min: 0.2, max: 1.5, step: 0.05 },
                'Base Enemy Count': { key: 'enemies.count', type: 'slider', min: 1, max: 12, step: 1 },
                'Small Enemy Health': { key: 'enemies.smallHealth', type: 'slider', min: 1, max: 100, step: 1 },
                'Medium Enemy Health': { key: 'enemies.mediumHealth', type: 'slider', min: 1, max: 150, step: 1 },
                'Large Enemy Health': { key: 'enemies.largeHealth', type: 'slider', min: 1, max: 250, step: 1 },
                'Enemy Speed': { key: 'enemies.speed', type: 'slider', min: 30, max: 300, step: 5 },
                'Enemy Aggression Range': { key: 'enemies.aggressionRange', type: 'slider', min: 60, max: 220, step: 4 },
                'Small Enemy Damage': { key: 'enemies.smallDamage', type: 'slider', min: 0.1, max: 1, step: 0.05 },
                'Medium Enemy Damage': { key: 'enemies.mediumDamage', type: 'slider', min: 0.1, max: 1, step: 0.05 },
                'Large Enemy Damage': { key: 'enemies.largeDamage', type: 'slider', min: 0.1, max: 2, step: 0.05 },
                'Ground Hole Count': { key: 'hazards.holeCount', type: 'slider', min: 2, max: 14, step: 1 },
                'Minimum Hole Width': { key: 'hazards.minHoleWidth', type: 'slider', min: 80, max: 260, step: 10 },
                'Maximum Hole Width': { key: 'hazards.maxHoleWidth', type: 'slider', min: 120, max: 360, step: 10 },
                'Fall Damage': { key: 'hazards.fallDamage', type: 'slider', min: 1, max: 1, step: 1 },
            }
        });

        // ── Runtime state ──
        const PLAYER_W = 64;
        const PLAYER_H = 96;

        let player = {
            x: cfg.player.startX,
            y: cfg.levels?.[0]?.startY ?? cfg.player.startY,
            vx: 0,
            vy: 0,
            w: PLAYER_W,
            h: PLAYER_H,
            onGround: false,
            facingRight: true,
            animState: 'idle',
            animTime: 0,
            attack: null,
            cfaActive: false,
            blueBoost: false,
            health: Number(cfg.player.maxHealth ?? 5),
            hurtTimer: 0,
            damageFlash: 0
        };

        let cameraX = 0;
        let currentLevelIndex = 0;
        let levelComplete = false;
        let levelTransition = null;
        let allLevelsComplete = false;
        let exitUnlocked = false;
        // Long side-scrolling stages give the chase, platforms, and hazards room to breathe.
        // The canvas itself is always the full game surface; this is world width, not a
        // viewport ratio or a rendering limit.
        const BASE_LEVEL_LENGTH = 4400;
        let groundHoles = [];
        let crossingPlatforms = [];
        let groundSegments = [];
        let lastSafeX = 0;
        let fallRespawnTimer = 0;
        let worldTime = 0;
        let screenShakeTimer = 0;
        let screenShakePower = 0;

        const defaultLevelTemplates = [
            {
                id: 'college', name: 'IIT Guwahati', shortName: 'IITG', background: 'college_background',
                groundY: 1080, skyColor: '#87CEEB', groundColor: '#6B8E23', lengthMultiplier: 1.15,
                enemyCount: 14, platforms: [
                    { x: 420, y: 930, w: 250, h: 24, motion: { axis: 'horizontal', amplitude: 54, period: 3.4 } },
                    { x: 760, y: 810, w: 210, h: 24 }, { x: 1050, y: 690, w: 230, h: 24, motion: { axis: 'vertical', amplitude: 62, period: 3.8 } },
                    { x: 1360, y: 790, w: 220, h: 24 }, { x: 1660, y: 620, w: 250, h: 24 }, { x: 2000, y: 740, w: 220, h: 24, motion: { axis: 'horizontal', amplitude: 66, period: 4.2 } },
                    { x: 2320, y: 570, w: 260, h: 24 }, { x: 2670, y: 700, w: 220, h: 24 }, { x: 2980, y: 840, w: 260, h: 24 },
                    { x: 3340, y: 700, w: 240, h: 24, motion: { axis: 'vertical', amplitude: 58, period: 3.5 } }, { x: 3690, y: 590, w: 260, h: 24 }, { x: 4040, y: 760, w: 250, h: 24 }
                ]
            },
            {
                id: 'office', name: 'Goldman Sachs', shortName: 'OFFICE', background: 'office_background',
                groundY: 1080, skyColor: '#9eb8cc', groundColor: '#495b70', lengthMultiplier: 1.35,
                enemyCount: 18, platforms: [
                    { x: 380, y: 920, w: 260, h: 24 }, { x: 710, y: 780, w: 220, h: 24, motion: { axis: 'vertical', amplitude: 66, period: 3.6 } },
                    { x: 1010, y: 640, w: 250, h: 24 }, { x: 1340, y: 760, w: 220, h: 24 }, { x: 1640, y: 560, w: 270, h: 24, motion: { axis: 'horizontal', amplitude: 70, period: 4 } },
                    { x: 2000, y: 690, w: 230, h: 24 }, { x: 2310, y: 830, w: 260, h: 24 }, { x: 2660, y: 670, w: 240, h: 24 },
                    { x: 2980, y: 530, w: 280, h: 24, motion: { axis: 'vertical', amplitude: 70, period: 3.9 } }, { x: 3350, y: 680, w: 230, h: 24 }, { x: 3660, y: 800, w: 260, h: 24 }, { x: 4010, y: 650, w: 260, h: 24 }
                ]
            },
            {
                id: 'bar', name: 'Chin Lung', shortName: 'BAR', background: 'bar_background',
                groundY: 1080, skyColor: '#241b42', groundColor: '#34253e', lengthMultiplier: 1.6,
                enemyCount: 22, platforms: [
                    { x: 400, y: 920, w: 250, h: 24, motion: { axis: 'horizontal', amplitude: 60, period: 3.1 } }, { x: 720, y: 770, w: 220, h: 24 },
                    { x: 1020, y: 610, w: 250, h: 24 }, { x: 1350, y: 730, w: 220, h: 24, motion: { axis: 'vertical', amplitude: 68, period: 3.7 } }, { x: 1650, y: 540, w: 280, h: 24 },
                    { x: 2020, y: 690, w: 240, h: 24 }, { x: 2340, y: 840, w: 260, h: 24 }, { x: 2690, y: 680, w: 230, h: 24 },
                    { x: 3000, y: 510, w: 280, h: 24, motion: { axis: 'both', amplitude: 54, period: 4.1 } }, { x: 3380, y: 650, w: 240, h: 24 }, { x: 3700, y: 790, w: 270, h: 24 },
                    { x: 4060, y: 610, w: 250, h: 24 }, { x: 4400, y: 720, w: 260, h: 24 }
                ]
            }
        ];

        function getLevelConfig(index = currentLevelIndex) {
            const legacy = index === 0 ? (cfg.level || {}) : {};
            const template = defaultLevelTemplates[index] || defaultLevelTemplates[0];
            const configured = Array.isArray(cfg.levels) ? cfg.levels[index] : null;
            const level = Object.assign({}, template, legacy, configured || {});
            // Older saved configs contain only three decorative platforms. Use the
            // authored route unless a newer map intentionally supplies six or more.
            if (!configured || !Array.isArray(configured.platforms) || configured.platforms.length < 6) {
                level.platforms = template.platforms;
            }
            return level;
        }

        function getLevelLength(index = currentLevelIndex) {
            const level = getLevelConfig(index);
            const globalMultiplier = Number(cfg.level?.lengthMultiplier ?? 1);
            const localMultiplier = Number(level.lengthMultiplier ?? 1);
            const scaledLength = BASE_LEVEL_LENGTH * Math.max(0.6, globalMultiplier) * Math.max(0.6, localMultiplier);
            const routeEnd = Math.max(...(level.platforms || []).map(platform => Number(platform.x) + Number(platform.w ?? 280)), 3200);
            // Never place an exit beyond the final built section of the route.
            return Math.max(3200, Math.min(scaledLength, routeEnd + 460));
        }

        function getEnemyCount() {
            const level = getLevelConfig();
            const fallbackCount = Number(cfg.enemies?.count ?? 6) + currentLevelIndex * 2;
            return Math.max(1, Math.round(Number(level.enemyCount ?? fallbackCount)));
        }

        // Generate safe ground segments once per level attempt. Holes are runtime
        // hazards rather than creator-authored objects, so every restart gets a
        // fresh, client-side layout while the opening and finish remain forgiving.
        function generateGroundHoles() {
            const level = getLevelConfig();
            const levelLength = getLevelLength();
            const groundY = Number(level.groundY ?? 1080);
            // Designed crossings: the second and third exceed a running jump.
            // Each has a reachable approach, a ferry, and a safe landing ledge.
            const holes = [
                { x: 900, w: 220 }, { x: 1800, w: 680 }, { x: 3100, w: 760 }
            ].filter(h => h.x + h.w < levelLength - 400).map(h => ({
                ...h, y: groundY, edgeLeft: 14, edgeRight: 18, cracks: []
            }));
            crossingPlatforms = holes.filter(h => h.w > 400).flatMap((h, i) => [
                { x: h.x - 150, y: groundY - 130, w: 190, h: 24 },
                { x: h.x + 220, y: groundY - 190, w: 210, h: 24,
                  motion: { axis: 'horizontal', amplitude: 150, period: 4.8 - currentLevelIndex * .4, phase: i } },
                { x: h.x + h.w - 90, y: groundY - 120, w: 210, h: 24 }
            ]);
            groundHoles = holes;
            groundSegments = [];
            let segmentStart = -2000;
            for (const hole of groundHoles) {
                if (hole.x - segmentStart > 40) {
                    groundSegments.push({ x: segmentStart, y: groundY, w: hole.x - segmentStart, h: 400, isGround: true });
                }
                segmentStart = hole.x + hole.w;
            }
            if (levelLength + 2600 - segmentStart > 40) {
                groundSegments.push({ x: segmentStart, y: groundY, w: levelLength + 2600 - segmentStart, h: 400, isGround: true });
            }
            lastSafeX = getSafeGroundX(Number(level.startX ?? cfg.player.startX ?? 120), PLAYER_W);
        }

        function findSafeRespawnX(preferredX, entityWidth = PLAYER_W) {
            const safeSegments = groundSegments.filter(segment => segment.w > entityWidth + 64);
            if (!safeSegments.length) return Math.max(24, Math.min(getLevelLength() - entityWidth - 24, preferredX));
            const containing = safeSegments.find(segment => preferredX >= segment.x && preferredX + entityWidth <= segment.x + segment.w);
            if (containing) return Math.max(containing.x + 24, Math.min(containing.x + containing.w - entityWidth - 24, preferredX));
            const segment = safeSegments.slice().sort((a, b) => Math.abs((a.x + a.w / 2) - preferredX) - Math.abs((b.x + b.w / 2) - preferredX))[0];
            return Math.max(segment.x + 24, Math.min(segment.x + segment.w - entityWidth - 24, segment.x + 40));
        }

        function isOverGroundHole(x, width = PLAYER_W) {
            const center = x + width / 2;
            return groundHoles.some(hole => center > hole.x - 8 && center < hole.x + hole.w + 8);
        }

        function holeAhead(x, width, direction, lookAhead = 160) {
            const front = direction > 0 ? x + width : x;
            return groundHoles.find(hole => direction > 0
                ? hole.x >= front - 8 && hole.x <= front + lookAhead
                : hole.x + hole.w <= front + 8 && hole.x + hole.w >= front - lookAhead);
        }

        function handlePlayerFall() {
            if (fallRespawnTimer > 0 || gameOver || levelTransition || allLevelsComplete) return;
            const level = getLevelConfig();
            const preferredX = player.x;
            const fallDamage = Number(cfg.hazards?.fallDamage ?? 1);
            hurtPlayer(fallDamage, player.x - 80);
            player.attack = null;
            player.vx = 0;
            player.vy = 0;
            const respawnX = findSafeRespawnX(lastSafeX || preferredX, PLAYER_W);
            player.x = respawnX;
            player.y = Number(level.groundY ?? 1080) - PLAYER_H - 16;
            player.onGround = true;
            lastSafeX = respawnX;
            fallRespawnTimer = 0.32;
        }

        function getSafeGroundX(preferredX, entityWidth = PLAYER_W) {
            const center = Number(preferredX) + entityWidth / 2;
            const validSegments = groundSegments.filter(segment => segment.w > entityWidth + 48);
            if (!validSegments.length) return Math.max(24, Number(preferredX) || 24);
            const containing = validSegments.find(segment => center >= segment.x + 24 && center <= segment.x + segment.w - 24);
            const segment = containing || validSegments.slice().sort((a, b) => {
                const ac = Math.abs(center - (a.x + a.w / 2));
                const bc = Math.abs(center - (b.x + b.w / 2));
                return ac - bc;
            })[0];
            return Math.max(segment.x + 24, Math.min(segment.x + segment.w - entityWidth - 24, Number(preferredX) || segment.x + 24));
        }

        // Runtime enemy state is intentionally separate from gameConfig. The config
        // supplies tuning values; positions, health, AI timers, and defeat animation
        // belong only to this play session.
        const enemyTypes = {
            small: { name: 'Yash', w: 48, h: 92, healthKey: 'smallHealth', damageKey: 'smallDamage', speedScale: 1.18, attackDamage: 0.35, attackCooldown: 0.95, color: '#e45c52' },
            medium: { name: 'Himank', w: 58, h: 102, healthKey: 'mediumHealth', damageKey: 'mediumDamage', speedScale: 1, attackDamage: 0.5, attackCooldown: 1.08, color: '#2a9d8f' },
            large: { name: 'Rizzwan', w: 62, h: 116, healthKey: 'largeHealth', damageKey: 'largeDamage', speedScale: 0.76, attackDamage: 0.75, attackCooldown: 1.3, color: '#563267' }
        };
        let enemies = [];
        let healthPickups = [];
        let defeatBursts = [];
        let powerups = [];

            cfa: { name: 'CFA Book', duration: 18, color: '#75e7ff', description: 'Hold J / K for finance beams' },

        function registerStyle(style, enemy) {

        function enemyTypeForIndex(index) {
            if (index % 5 === 4) return 'large';

        function spawnEnemies() {
            enemies = [];
            const enemyCfg = cfg.enemies || {};
            const count = getEnemyCount();
            const level = getLevelConfig();
            const levelLength = getLevelLength();
            const startX = Math.max(360, Number(level.startX ?? cfg.player.startX ?? 120) + 240);
            const routePlatforms = getPlatforms().filter(platform => !platform.isGround);
            // Guarantee a small random subset of enemies can drop a one-heart refill.
            const dropTargetCount = Math.max(1, Math.min(3, Math.floor(count / 3)));
            const healthDropIndices = new Set();
            while (healthDropIndices.size < dropTargetCount) {
                healthDropIndices.add(Math.floor(Math.random() * count));
            }
            for (let i = 0; i < count; i++) {
                const type = enemyTypeForIndex(i);
                const spec = enemyTypes[type];
                const progress = count <= 1 ? 0 : i / (count - 1);
                const laneOffset = (i % 2) * 70;
                const rawX = Math.min(levelLength - spec.w - 180, startX + progress * Math.max(520, levelLength - startX - 420) + laneOffset);
                const routeIndex = Math.min(routePlatforms.length - 1, Math.round(progress * (routePlatforms.length - 1)));
                const routePlatform = i % 3 === 0 ? null : routePlatforms[routeIndex];
                const x = routePlatform
                    ? Math.max(routePlatform.x + 12, Math.min(routePlatform.x + routePlatform.w - spec.w - 12, rawX))
                    : getSafeGroundX(rawX, spec.w);
                enemies.push({
                    id: `enemy-${i}-${Math.random().toString(36).slice(2, 7)}`,
                    type,
                    x,
                    spawnX: x,
                    awakened: false,
                    y: routePlatform ? routePlatform.y - (spec.h + 16) : Number(level.groundY ?? cfg.level.groundY) - (spec.h + 16),
                    w: spec.w,
                    h: spec.h,
                    vx: 0,
                    vy: 0,
                    onGround: false,
                    facingRight: false,
                    health: Number(enemyCfg[spec.healthKey] ?? (type === 'small' ? 28 : type === 'medium' ? 52 : 88)),
                    maxHealth: Number(enemyCfg[spec.healthKey] ?? (type === 'small' ? 28 : type === 'medium' ? 52 : 88)),
                    attackTimer: 0.35 + i * 0.12,
                    attackPulse: 0,
                    hurtTimer: 0,
                    flashTimer: 0,
                    defeatTimer: 0,
                    healthDrop: healthDropIndices.has(i),
                    healthDropSpawned: false,
                    jumpCooldown: 0.25 + (i % 3) * 0.2,
                    animTime: i * 0.3,
                    // Larger enemies read terrain better; reckless rookies can still
                    // make a bad call and tumble into a pit.
                    iq: type === 'large' ? 0.92 : type === 'medium' ? 0.70 : 0.34 + (i % 3) * 0.09,
                    pitTimer: 0
                });
            }
            if (currentLevelIndex === 2) {
                const end = getLevelLength();
                boss = { ...enemies.find(e => e.type === 'large'), id: 'boss-rizzwan', boss: true,
                    x: end - 330, y: Number(level.groundY) - 236, w: 140, h: 220,
                    health: 480, maxHealth: 480, awakened: false, onGround: true,
                    phase: 'approach', timer: 1, attackNumber: 0, healthDrop: false, support: null };
                enemies.push(boss);
            }
            enemySpawned = true;
        }

        function intersects(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function enemyBodyBox(enemy) {
            return { x: enemy.x + 5, y: enemy.y + 8, w: enemy.w - 10, h: enemy.h + 8 };
        }

        function addDefeatBurst(enemy) {
            defeatBursts.push({ x: enemy.x + enemy.w / 2, y: enemy.y + enemy.h * 0.42, time: 0, duration: 0.42, color: enemyTypes[enemy.type].color });
        }

        function damageEnemy(enemy, amount, style = null) {
            if (enemy.defeatTimer > 0 || enemy.hurtTimer > 0) return;
            if (style) amount *= registerStyle(style, enemy);
            enemy.health -= amount * (enemy.boss && enemy.phase !== 'recover' ? .45 : 1);
            enemy.hurtTimer = 0.12;
            enemy.flashTimer = 0.16;
            if (enemy.health <= 0) {
                enemy.health = 0;
                stageScore += enemy.boss ? 1000 : enemy.type === 'large' ? 150 : enemy.type === 'medium' ? 100 : 60;
                if (enemy.boss) { bossDefeated = true; exitUnlocked = true; }
                enemy.defeatTimer = 0.42;
                enemy.vx = player.facingRight ? 170 : -170;
                enemy.vy = -230;
                addDefeatBurst(enemy);
                playSound('defeat', 0.62);
                if (!enemy.boss && (levelDropCount < 2 && Math.random() < .25)) {
                    const kind = currentLevelIndex === 0 ? 'cat' : currentLevelIndex === 1 ? 'cfa' : 'blue';
                    dropPowerup(kind, enemy);
                    levelDropCount++;
                }
                if (enemy.healthDrop && !enemy.healthDropSpawned) {
                    const pickupY = enemy.y + enemy.h - 40;
                    healthPickups.push({
                        x: enemy.x + enemy.w / 2 - 20,
                        y: pickupY,
                        baseY: pickupY,
                        w: 40,
                        h: 40,
                        time: 0,
                        id: `health-${enemy.id}`
                    });
                    enemy.healthDropSpawned = true;
                }
            }
        }

        function hurtPlayer(amount, sourceX) {
            if (gameOver || levelTransition || allLevelsComplete || player.hurtTimer > 0 || player.health <= 0) return;
            styleChain = 0; styleTimer = 0; lastStyle = '';
            player.health = Math.max(0, player.health - amount);
            player.hurtTimer = Math.max(0.05, Number(cfg.player.invincibilityDuration ?? 0.85));
            player.damageFlash = 0.24;
            player.vx = player.x < sourceX ? -180 : 180;
            player.vy = -180;
            playSound('hurt', 0.55);

            if (player.health <= 0) {
                player.health = 0;
                player.attack = null;
                player.vx = 0;
                player.vy = 0;
                pendingAttack = null;
                gameOver = true;
                if (gameOverOverlay) gameOverOverlay.classList.remove('is-hidden');
            }
        }

        // Punches are quick and close; kicks take longer but reach farther.
        // The hitbox is kept as runtime state so the next enemy step can consume
        // it without changing the attack input or animation system.
        const combatCfg = cfg.combat || {};
        const attackDefinitions = {
            punch: {
                duration: 0.22,
                activeStart: 0.045,
                activeEnd: 0.15,
                range: 48,
                height: 34,
                damage: Number(combatCfg.punchDamage ?? 12),
                cooldown: Number(combatCfg.punchCooldown ?? 0.28)
            },
            kick: {
                duration: 0.42,
                activeStart: 0.095,
                activeEnd: 0.30,
                range: 86,
                height: 42,
                damage: Number(combatCfg.kickDamage ?? 22),
                cooldown: Number(combatCfg.kickCooldown ?? 0.7)
            },
            beam: {
                duration: 0.34, activeStart: 0.06, activeEnd: 0.27,
                range: 360, height: 64, damage: 24, cooldown: 0.55
            }
        };
        const attackCooldowns = { punch: 0, kick: 0, beam: 0 };
        let nextAttackId = 1;

        function startAttack(type) {
            if (player.cfaActive && (type === 'punch' || type === 'kick')) type = 'beam';
            const data = attackDefinitions[type];
            if (!data || player.attack || attackCooldowns[type] > 0) return false;
            player.attack = { type, elapsed: 0, hitIds: new Set(), id: nextAttackId++ };
            attackCooldowns[type] = data.cooldown;
            player.vx = 0;
            playSound(type === 'kick' ? 'kick' : 'punch', type === 'kick' ? 0.72 : 0.5);
            screenShakeTimer = type === 'kick' ? 0.10 : 0.055;
            screenShakePower = type === 'kick' ? 7 : 3;
            return true;
        }

        function getAttackHitbox() {
            if (!player.attack) return null;
            const data = attackDefinitions[player.attack.type];
            const progress = Math.max(0, Math.min(1, player.attack.elapsed / data.duration));
            const reach = data.range * (0.45 + progress * 0.55);
            const x = player.facingRight
                ? player.x + player.w - 6
                : player.x + 6 - reach;
            return {
                x,
                y: player.y + (player.attack.type === 'kick' ? 38 : 26),
                w: reach,
                h: data.height,
                damage: data.damage * (player.blueBoost && player.attack.type !== 'beam' ? 1.8 : 1),
                active: player.attack.elapsed >= data.activeStart && player.attack.elapsed <= data.activeEnd
            };
        }

        // ── Cached character art ──
        // Load the generated protagonist once at startup; never fetch assets in the game loop.
        const assetCache = {};
        const fallbackAssetUrls = {
            helper_girl_small: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/helper_girl_small_12443e28-f1f1-4f11-8a80-4c0db22e36f2.webp',
            helper_girl_large: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/helper_girl_large_3edeeaa4-0fdb-4256-8fc5-599d35ddd5aa.webp',
            player_character: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/player_character_7dcf7b59-1df3-45dc-9e02-95aa87cdb997.webp',
            enemy_small: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/enemy_small_1058de26-e6f8-40b1-b2ab-cf861bbb1fff.webp',
            enemy_medium: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/enemy_medium_6ff813e3-c8f1-4ad9-b02f-582539d28877.webp',
            enemy_large: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/enemy_large_9c6742fe-6f52-4bd2-a597-0b6401897d43.webp',
            hidden_phone_icon: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/hidden_phone_icon_6bdc5f74-f859-4220-ab96-bd37c986f4f9.webp',

            college_background: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/college_background_1f2c8fc9-a8e7-4c42-ab49-f36f969f027d.webp',

        const helperImages = { small: loadImageAsset('helper_girl_small'), big: loadImageAsset('helper_girl_large') };
        const playerAssetState = loadImageAsset('player_character');

        // Enemy art is loaded once at startup. The small/medium/large variants

        // Sound is optional and starts after the first input, satisfying browser

        const soundUrls = {
            punch: 'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/punch_sfx_e8612e8d-e88c-40bd-9200-b69bff8572a2.mp3',
            kick: 'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/kick_sfx_61bda66b-12e9-41f4-921d-bfa1219448ea.mp3',

        };
        let soundEnabled = false;
        let levelMusic = null;
        let motorAudioContext = null;
        let motorOscillator = null;
        let motorGain = null;
        function playSound(name, volume = 0.55) {
            if (!soundEnabled || !soundUrls[name]) return;
            const audio = new Audio(soundUrls[name]);
            audio.volume = Math.max(0, Math.min(1, volume * Number(cfg.audio?.sfxVolume ?? 0.65)));
            void audio.play().catch(() => {});
        }
        function enableSound() {
            soundEnabled = true;
            if (!levelMusic) {
                levelMusic = new Audio(soundUrls.music);
                levelMusic.loop = true;
                levelMusic.volume = Math.max(0, Math.min(1, Number(cfg.audio?.musicVolume ?? 0.18)));
                void levelMusic.play().catch(() => {});
            }
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!motorAudioContext && AudioContextClass) {
                try { motorAudioContext = new AudioContextClass(); } catch (_) { motorAudioContext = null; }
            }

        }
        function startMotorcycleSound() {
            if (!soundEnabled || !motorAudioContext || motorOscillator) return;
            motorOscillator = motorAudioContext.createOscillator();
            motorGain = motorAudioContext.createGain();
            motorOscillator.type = 'sawtooth';
            motorOscillator.frequency.value = 74;
            motorGain.gain.value = 0.045;
            motorOscillator.connect(motorGain); motorGain.connect(motorAudioContext.destination); motorOscillator.start();
        }
        function stopMotorcycleSound() {
            if (!motorOscillator) return;
            try { motorOscillator.stop(); } catch (_) {}
            motorOscillator.disconnect(); motorOscillator = null; motorGain = null;
        }

        // ── Input state ──
        const keys = {};
        let joystickX = 0; // -1 to 1
        let jumpPressed = false;
        let jumpConsumed = false;
        let pendingAttack = null;

        // Keyboard. J and K queue one attack per press instead of repeating
        // continuously when a key is held down.
        window.addEventListener('keydown', e => {
            enableSound();
            if (gameOver && !e.repeat && (e.code === 'KeyR' || e.code === 'Enter')) {
                e.preventDefault();
                restartLevel();
                return;
            }
            keys[e.code] = true;
            if (!e.repeat && e.code === 'KeyJ') pendingAttack = 'punch';
            if (!e.repeat && e.code === 'KeyK') pendingAttack = 'kick';

        // ── Touch controls ──
        let touchControlsEl = null;

        function createTouchControls() {
            touchControlsEl = document.createElement('div');

            // Joystick

            function bindAttackButton(button, type) {
                const press = e => {

                const release = () => button.classList.remove('pressed');
                button.addEventListener('pointerdown', press, { passive: false });
                button.addEventListener('pointerup', release);
                button.addEventListener('pointercancel', release);
                button.addEventListener('pointerleave', release);
            }
            bindAttackButton(punchBtn, 'punch');
            bindAttackButton(kickBtn, 'kick');

            // Joystick touch handling
            jZone.addEventListener('touchstart', handleJoystickStart, { passive: false });
            jZone.addEventListener('touchmove', handleJoystickMove, { passive: false });
            jZone.addEventListener('touchend', handleJoystickEnd, { passive: false });
            jZone.addEventListener('touchcancel', handleJoystickEnd, { passive: false });

            // Jump touch
            jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); jumpPressed = true; }, { passive: false });
            jumpBtn.addEventListener('touchend', e => { e.preventDefault(); jumpPressed = false; jumpConsumed = false; }, { passive: false });
            jumpBtn.addEventListener('touchcancel', e => { jumpPressed = false; jumpConsumed = false; }, { passive: false });
        }

        function handleJoystickStart(e) {
            e.preventDefault();
            joystickTouch = e.changedTouches[0].identifier;
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            e.preventDefault();
            for (let t of e.touches) {
                if (t.identifier === joystickTouch) {
                    const rect = joystickBase.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const dx = t.clientX - cx;
                    const maxR = rect.width / 2 - 16;
                    const clamped = Math.max(-maxR, Math.min(maxR, dx));
                    joystickX = clamped / maxR;
                    joystickKnob.style.transform = `translate(calc(-50% + ${clamped}px), -50%)`;
                }
            }
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            for (let t of e.changedTouches) {
                if (t.identifier === joystickTouch) {
                    joystickTouch = null;
                    joystickX = 0;
                    joystickKnob.style.transform = 'translate(-50%, -50%)';

        function updateHud() {

        // ── Helper: get platforms ──
        function restartLevel() {
            gameOver = false;

            attackCooldowns.punch = 0;

            healthPickups = [];
            powerups = [];
            levelDropCount = 0;
            for (const kind of Object.keys(powerupTimers)) powerupTimers[kind] = 0;

            powerupMessageTimer = 0;

        function getPlatforms(time = worldTime) {
            const level = getLevelConfig();
            const platforms = [...(Array.isArray(level.platforms) ? level.platforms : []), ...crossingPlatforms];
            const fallbackGround = {
                x: -2000,
                y: Number(level.groundY ?? 1080),
                w: getLevelLength() + 2600,
                h: 400,
                isGround: true
            };
            const ground = groundSegments.length ? groundSegments : [fallbackGround];
            return [
                ...ground,
                ...platforms.map((platform, index) => {
                    const motion = platform.motion;
                    const axis = motion?.axis || 'none';
                    const amplitude = Number(motion?.amplitude ?? 0);
                    const period = Math.max(1.4, Number(motion?.period ?? 3.5));
                    const phase = Number(motion?.phase ?? index * 0.9);
                    const wave = Math.sin(time * (Math.PI * 2 / period) + phase);
                    return {
                    x: Number(platform.x) + (axis === 'horizontal' || axis === 'both' ? wave * amplitude : 0),
                    y: Number(platform.y) + (axis === 'vertical' || axis === 'both' ? wave * amplitude : 0),
                    w: Number(platform.w ?? 280),
                    h: Number(platform.h ?? 24),
                    id: `platform-${index}`,
                    isGround: false,
                    moving: axis !== 'none' && amplitude > 0
                    };
                })
            ];
        }

        function beginLevel(index) {
            levelComplete = false;
            levelTransition = null;
            gameOver = false;
            boss = null; bossDefeated = false;

            // caused by the player's configured legacy startY.

            enemies = [];

        function startLevelTransition() {
            if (levelComplete || levelTransition || allLevelsComplete || gameOver) return;
            levelComplete = true;
            levelTransition = { timer: 1.35, duration: 1.35, nextIndex: currentLevelIndex + 1 };
            transitionTitleEl.textContent = currentLevelIndex < 2 ? `LEVEL ${currentLevelIndex + 1} CLEAR!` : 'ALL LEVELS CLEAR!';
            transitionCopyEl.textContent = currentLevelIndex < 2
                ? `Get ready for ${getLevelConfig(currentLevelIndex + 1).name}.`
                : 'Rizzwan defeated. Your Dyson Airwrap awaits!';
            levelTransitionOverlay.classList.remove('is-hidden');
        }

        function updateLevelTransition(dt) {
            if (!levelTransition) return;
            levelTransition.timer -= dt;
            if (levelTransition.timer > 0) return;
            const nextIndex = levelTransition.nextIndex;
            levelTransition = null;
            levelTransitionOverlay.classList.add('is-hidden');
            if (nextIndex >= 3) {
                allLevelsComplete = true;
                completionOverlay.classList.remove('is-hidden');
                return;
            }
            beginLevel(nextIndex);
        }

        // ── Edit mode: draggable platform ──
        let editDragging = null;
        let editDragOffset = { x: 0, y: 0 };

        if (mode === 'edit') {
            canvas.addEventListener('mousedown', e => {
                const mx = e.offsetX + cameraX;
                const my = e.offsetY;
                // Check platform
                const editLevel = getLevelConfig();
                const editPlatform = editLevel.platforms?.[0] || { x: cfg.level.platformX, y: cfg.level.platformY, w: cfg.level.platformW };
                const px = Number(editPlatform.x);
                const py = Number(editPlatform.y);
                const pw = Number(editPlatform.w);
                if (mx >= px && mx <= px + pw && my >= py - 12 && my <= py + 36) {
                    editDragging = 'platform';
                    editDragOffset.x = mx - px;
                    editDragOffset.y = my - py;
                }
                // Check player start
                const psx = cfg.player.startX;
                const psy = cfg.player.startY;
                if (mx >= psx && mx <= psx + PLAYER_W && my >= psy && my <= psy + PLAYER_H) {
                    editDragging = 'player';
                    editDragOffset.x = mx - psx;
                    editDragOffset.y = my - psy;
                }
            });
            canvas.addEventListener('mousemove', e => {
                if (!editDragging) return;
                const mx = e.offsetX + cameraX;
                const my = e.offsetY;
                if (editDragging === 'platform') {
                    const level = getLevelConfig();
                    if (Array.isArray(level.platforms) && level.platforms[0]) {
                        level.platforms[0].x = Math.round((mx - editDragOffset.x) / 8) * 8;
                        level.platforms[0].y = Math.round((my - editDragOffset.y) / 8) * 8;
                    } else {
                        cfg.level.platformX = Math.round((mx - editDragOffset.x) / 8) * 8;
                        cfg.level.platformY = Math.round((my - editDragOffset.y) / 8) * 8;
                    }
                } else if (editDragging === 'player') {
                    cfg.player.startX = Math.round((mx - editDragOffset.x) / 8) * 8;
                    cfg.player.startY = Math.round((my - editDragOffset.y) / 8) * 8;
                    player.x = cfg.player.startX;
                    player.y = cfg.player.startY;
                }
            });
            canvas.addEventListener('mouseup', () => { editDragging = null; });
            canvas.addEventListener('mouseleave', () => { editDragging = null; });
        }

        if (mode === 'edit') spawnEnemies();
        else beginLevel(0);

        // ── Drawing ──
        function drawBackground() {
            const level = getLevelConfig();
            const groundScreen = Math.min(viewportHeight(), Number(level.groundY ?? 1080) - cameraY());
            ctx.fillStyle = level.skyColor || '#87CEEB';
            ctx.fillRect(0, 0, viewportWidth(), viewportHeight());

            const state = backgroundImageStates[level.id];
            const image = state && state.image;
            if (state && state.ready && image) {
                    // Fill the entire responsive canvas and tile only horizontally for
                // the long world. No fixed aspect-ratio crop limits the map view.
                const bgW = Math.max(viewportWidth(), 1);
                const bgH = Math.max(viewportHeight(), groundScreen, 1);
                const offset = ((cameraX * 0.36) % bgW + bgW) % bgW;
                const top = 0;
                ctx.globalAlpha = 0.98;
                ctx.drawImage(image, -offset, top, bgW, bgH);
                ctx.drawImage(image, bgW - offset, top, bgW, bgH);
                ctx.globalAlpha = 1;
            } else {
                // Graceful authored fallback while a generated background is loading.
                const parallax = cameraX * 0.3;
                const buildingColor = level.id === 'bar' ? '#382b54' : level.id === 'office' ? '#647b91' : '#6b8f71';
                ctx.fillStyle = buildingColor;
                for (let i = 0; i < 8; i++) {
                    const bx = i * 300 - (parallax % 300) - 100;
                    const bh = 180 + (i * 37 % 120);
                    ctx.fillRect(bx, groundScreen - bh, 160, bh);
                    ctx.fillStyle = level.id === 'bar' ? '#ff58c8' : '#ffe87c';
                    for (let wy = 0; wy < bh - 40; wy += 48) {
                        for (let wx = 16; wx < 140; wx += 40) ctx.fillRect(bx + wx, groundScreen - bh + 20 + wy, 24, 32);
                    }
                    ctx.fillStyle = buildingColor;
                }
                if (level.id === 'college') {
                    const tp = cameraX * 0.5;
                    for (let i = 0; i < 8; i++) {
                        const tx = i * 250 - (tp % 250) - 50;
                        ctx.fillStyle = '#8B5E3C';
                        ctx.fillRect(tx + 15, groundScreen - 100, 20, 100);
                        ctx.fillStyle = '#3d7a3e';
                        ctx.beginPath();
                        ctx.arc(tx + 25, groundScreen - 120, 50, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            ctx.fillStyle = level.id === 'bar' ? 'rgba(22,12,36,0.32)' : 'rgba(255,255,255,0.08)';
            ctx.fillRect(0, 0, viewportWidth(), Math.max(0, groundScreen));
        }

        function cameraY() { return 0; }

        function drawPlatforms() {
            const level = getLevelConfig();
            const platforms = getPlatforms();
            const groundPlatforms = platforms.filter(platform => platform.isGround);
            ctx.fillStyle = level.groundColor || '#6B8E23';
            for (const ground of groundPlatforms) {
                ctx.fillRect(ground.x - cameraX, ground.y, ground.w, ground.h);
                ctx.fillStyle = level.id === 'bar' ? '#8d4b9e' : level.id === 'office' ? '#8da5b8' : '#5cb85c';
                ctx.fillRect(ground.x - cameraX, ground.y, ground.w, 8);
                ctx.fillStyle = level.groundColor || '#6B8E23';
            }

            for (const hole of groundHoles) {
                const sx = hole.x - cameraX;
                if (sx + hole.w < -40 || sx > viewportWidth() + 40) continue;
                if (hole.w > 400) {
                    ctx.fillStyle = '#ffe0a0'; ctx.font = '700 18px Inter'; ctx.textAlign = 'left';
                    ctx.fillText('RIDE THE LIFT →', sx - 145, hole.y - 160);
                }
                const left = sx;
                const right = sx + hole.w;
                // Irregular edges, a shallow inner rim, and pavement cracks make
                // these read as believable damaged walkway sections rather than
                // giant rectangular cartoon pits.
                ctx.fillStyle = level.id === 'bar' ? '#160c2a' : '#111923';
                ctx.beginPath();
                ctx.moveTo(left, hole.y);
                ctx.lineTo(left + hole.edgeLeft, hole.y + 7);
                ctx.lineTo(left + hole.w * 0.32, hole.y + 3);
                ctx.lineTo(left + hole.w * 0.58, hole.y + 9);
                ctx.lineTo(right - hole.edgeRight, hole.y + 4);
                ctx.lineTo(right, hole.y);
                ctx.lineTo(right, viewportHeight() + 80);
                ctx.lineTo(left, viewportHeight() + 80);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = level.id === 'bar' ? '#b84b9b' : '#505965';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(left + 2, hole.y + 1);
                ctx.lineTo(left + hole.edgeLeft, hole.y + 7);
                ctx.lineTo(left + hole.w * 0.32, hole.y + 3);
                ctx.lineTo(left + hole.w * 0.58, hole.y + 9);
                ctx.lineTo(right - hole.edgeRight, hole.y + 4);
                ctx.lineTo(right - 2, hole.y + 1);
                ctx.stroke();

                ctx.strokeStyle = level.id === 'bar' ? 'rgba(235,113,210,0.38)' : 'rgba(131,143,153,0.48)';
                ctx.lineWidth = 2;
                for (const crack of hole.cracks || []) {
                    const crackX = left + crack.x;
                    const crackY = hole.y - 2;
                    ctx.beginPath();
                    ctx.moveTo(crackX, crackY);
                    ctx.lineTo(crackX + crack.side * 7, crackY - 7);
                    ctx.lineTo(crackX + crack.side * 13, crackY - 3);
                    ctx.lineTo(crackX + crack.side * crack.length, crackY - 12);
                    ctx.stroke();
                }
            }

            for (const p of platforms.filter(platform => !platform.isGround)) {
                const px = p.x - cameraX;
                // Static platforms are solid elevated floors, not floating props.
                // Their supports make the route read like a stepped building/Mario map.
                if (!p.moving) {
                    const floorY = Number(level.groundY ?? 1080);
                    const supportColor = level.id === 'bar' ? '#382344' : level.id === 'office' ? '#40566a' : '#7a431c';
                    ctx.fillStyle = supportColor;
                    ctx.fillRect(px + 18, p.y + p.h, 14, Math.max(0, floorY - p.y - p.h));
                    ctx.fillRect(px + p.w - 32, p.y + p.h, 14, Math.max(0, floorY - p.y - p.h));
                    ctx.fillStyle = 'rgba(255,255,255,.13)';
                    ctx.fillRect(px + 21, p.y + p.h, 3, Math.max(0, floorY - p.y - p.h));
                }
                ctx.fillStyle = level.id === 'bar' ? '#5e3979' : level.id === 'office' ? '#58738d' : '#b5651d';
                ctx.fillRect(px, p.y, p.w, p.h);
                ctx.strokeStyle = level.id === 'bar' ? '#d95bc5' : level.id === 'office' ? '#b9d5e8' : '#8B4513';
                ctx.lineWidth = 1;
                ctx.strokeRect(px, p.y, p.w, p.h);
